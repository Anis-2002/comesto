    <text x="80" y="455">Il cliente si vede col taglio addosso</text>
    <text x="80" y="490">prima di sedersi sulla poltrona.</text>
  </g>

  <rect x="80" y="533" width="286" height="46" rx="23" fill="#17181A" />
  <text x="223" y="562" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="500" fill="#FFFFFF">Prima settimana gratis</text>
  <text x="388" y="562"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" fill="#6E7176">comesto.me</text>

  <g fill="#FFD9A0">
